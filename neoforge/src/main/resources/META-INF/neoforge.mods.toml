modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''${description}'''
logoFile="assets/${mod_id}/icon.png"
displayURL="https://github.com/fakeneko/auto-switch-elytra"
issueTrackerURL="https://github.com/fakeneko/auto-switch-elytra/issues"

[[mixins]]
config="${mod_id}.mixins.json"
[[mixins]]
config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fakeneko_config"
type="required"
versionRange="[0,)"
ordering="NONE"
side="BOTH"
