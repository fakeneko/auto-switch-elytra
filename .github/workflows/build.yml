# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build & release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: fix gradle wrapper for CI
        run: |
          sed -i 's|file:///D:/workspace/gradle/gradle-8.14.4-bin.zip|https\://services.gradle.org/distributions/gradle-8.14-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: fix local java home for CI
        run: |
          sed -i 's/^org\.gradle\.java\.home=/# org.gradle.java.home=/' gradle.properties
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: collect release artifacts
        run: |
          mkdir -p release
          cp fabric/build/libs/*fabric*[0-9].jar release/ 2>/dev/null || true
          cp neoforge/build/libs/*neoforge*[0-9].jar release/ 2>/dev/null || true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
